<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT Cricket Multiplayer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
#app{max-width:980px;margin:auto;padding:14px}button,input,select{font:inherit}
.card{background:#101d31;border:1px solid #243754;border-radius:16px;padding:15px;margin:10px 0}
button{border:0;border-radius:10px;padding:12px 14px;margin:5px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#26364f}.danger{background:#b52b35}
input,select{background:#091423;color:#fff;border:1px solid #3a506d;border-radius:10px;padding:12px;width:100%;margin:5px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.hidden{display:none}.code{font-size:34px;letter-spacing:8px;font-weight:900;text-align:center;color:#ffd166}
#score{font-size:34px;font-weight:900}.small{opacity:.78}
#field{height:340px;background:linear-gradient(#16834a,#0d6538);border-radius:20px;position:relative;overflow:hidden;margin:12px 0}
.pitch{position:absolute;left:25%;right:25%;top:10px;bottom:10px;background:#cba66b;border-left:3px solid #ead39a;border-right:3px solid #ead39a}
.wicket{position:absolute;font-size:25px;z-index:2}.w1{top:32px;left:49%}.w2{bottom:32px;left:49%}
#ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#d71920;left:50%;top:45px;transform:translateX(-50%);transition:top .55s,left .55s}
#msg{position:absolute;left:8px;right:8px;top:145px;text-align:center;font-size:27px;font-weight:900;text-shadow:0 2px 4px #000}
#bowlButtons button{background:#8d3ed8}.spin button{background:#247fce}.fast button{background:#d24a32}
.shots button{background:#16845a}
h1,h2,h3{margin:7px 0}
.status{font-weight:800;color:#7ee787}
@media(max-width:520px){button{width:calc(50% - 12px);padding:11px 7px;font-size:12px}.code{font-size:26px;letter-spacing:5px}}
</style>
</head>
<body>
<div id="app">
<h1>🏏 CT CRICKET — MULTIPLAYER</h1>
<div class="card" id="connectCard">
<h3>🌐 Enter the match</h3>
<div class="row">
<div><button id="createBtn">CREATE MATCH</button></div>
<div><input id="roomInput" inputmode="numeric" maxlength="6" placeholder="Enter room code"></div>
<div><button id="joinBtn">JOIN MATCH</button></div>
</div>
<div id="myCode" class="code hidden"></div>
<div id="shareArea" class="hidden">
  <div class="row">
    <button id="copyCodeBtn" type="button">📋 COPY CODE</button>
    <button id="copyLinkBtn" type="button">🔗 COPY INVITE LINK</button>
    <button id="shareBtn" type="button">📤 SHARE GAME</button>
  </div>
  <input id="inviteLink" readonly aria-label="Invite link">
  <div id="copyStatus" class="small"></div>
</div>
<div id="connectionStatus" class="small">Connecting to multiplayer service…</div>
</div>

<div id="setupCard" class="card hidden">
<h3>Choose your bowling style</h3>
<select id="styleSelect"><option value="fast">⚡ Fast Bowler</option><option value="spin">🌀 Spin Bowler</option></select>
<button id="readyBtn">READY</button>
<div id="setupInfo" class="small"></div>
</div>

<div id="game" class="hidden">
<div class="card">
<div id="score">0/0</div>
<div>Ball: <span id="ballNo">0</span>/12 · <span id="turn"></span></div>
<div id="deliveryText" class="small">Waiting…</div>
</div>

<div id="field">
<div class="pitch"></div><div class="wicket w1">🪵🪵🪵</div><div class="wicket w2">🪵🪵🪵</div>
<div id="ball"></div><div id="msg"></div>
</div>

<div id="bowCard" class="card hidden">
<h3>🎯 Choose delivery</h3>
<div id="bowlButtons"></div>
</div>

<div id="batCard" class="card hidden">
<h3>🏏 Choose shot</h3>
<div id="shotButtons" class="shots"></div>
</div>
</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";

const DB={
fast:{
"Bouncer":["Inswing bouncer","Outswing bouncer","Quick bouncer","Slow bouncer","Cross seam bouncer","Reverse swing bouncer"],
"Good":["Inswing good","Outswing good","Quick good","Slow good","Cross seam good","Reverse swing good"],
"Full":["Inswing full","Outswing full","Quick full","Slow full","Cross seam full","Reverse swing full"],
"Yorker":["Inswing yorker","Outswing yorker","Quick yorker","Slow yorker","Cross seam yorker","Reverse swing yorker"],
"Full toss":["Inswing full toss","Outswing full toss","Quick full toss","Slow full toss","Cross seam full toss","Reverse swing full toss"]},
spin:{
"Leg spin":["Leg break","Slider","Googly","Flipper","Drifter","Zooter"],
"Off spin":["Off break","Top spin","Arm ball","Carrom ball","Doosra","Teesra","Mystery"]
}};

const MAP={
"Leg break":["stroke drive","stroke cut"],"Slider":["stroke drive","stroke cut"],"Googly":["stroke drive","stroke sweep"],"Flipper":["stroke sweep","stroke drive","stroke flick"],"Drifter":["stroke drive","stroke flick","loft"],"Zooter":["stroke drive","stroke cut"],
"Off break":["stroke drive","stroke sweep"],"Top spin":["stroke drive","stroke cut","loft pull"],"Arm ball":["loft","stroke drive","stroke flick","loft pull"],"Carrom ball":["stroke drive","stroke cut","stroke flick"],"Doosra":["stroke drive","stroke sweep","stroke cut","loft"],"Teesra":["stroke drive","loft switch hit","loft"],"mystery":["stroke drive","stroke flick","loft"],
"Inswing bouncer":["loft pull","loft hook"],"Outswing bouncer":["loft pull","loft hook","loft upper cut"],"Quick bouncer":["loft pull","loft hook","loft upper cut"],"Slow bouncer":["loft pull","loft hook"],"Cross seam bouncer":["loft pull","loft hook"],"Reverse swing bouncer":["loft pull","loft hook"],
"Inswing good":["stroke drive","stroke flick","loft","loft flick"],"Outswing good":["stroke drive","stroke cut","loft"],"Quick good":["stroke drive","stroke cut","loft"],"Slow good":["stroke drive","stroke cut","loft"],"Cross seam good":["stroke drive","stroke cut","loft"],"Reverse swing good":["stroke drive","stroke cut","stroke flick","loft"],
"Inswing full":["stroke drive","stroke flick","loft","loft flick"],"Outswing full":["stroke drive","loft"],"Quick full":["stroke drive","loft"],"Slow full":["stroke drive","stroke sweep","loft","loft switch hit"],"Cross seam full":["stroke drive","loft"],"Reverse swing full":["stroke drive","loft"],
"Inswing yorker":["stroke drive","stroke flick"],"Outswing yorker":["stroke cut"],"Quick yorker":["stroke drive"],"Slow yorker":["stroke drive"],"Cross seam yorker":["stroke drive"],"Reverse swing yorker":["stroke drive"],
"Inswing full toss":["stroke drive","stroke flick","loft","loft flick"],"Outswing full toss":["stroke drive","stroke cut","loft"],"Quick full toss":["stroke drive","loft"],"Slow full toss":["stroke drive","loft","loft hook"],"Cross seam full toss":["stroke drive","loft"],"Reverse swing full toss":["stroke drive","loft"]};

const SHOTS=["defence","push","stroke drive","stroke cut","stroke flick","stroke sweep","loft","loft pull","loft hook","loft upper cut","loft flick","loft switch hit"];
let peer=null,conn=null,isHost=false,myId="",roomId="",myStyle="fast",state={score:0,wk:0,balls:0,phase:"waiting",delivery:null,batPlayer:null,bowlPlayer:null};

const $=id=>document.getElementById(id);
function status(t){$("connectionStatus").textContent=t}
function send(o){if(conn&&conn.open)conn.send(o)}
function makeCode(){return String(Math.floor(100000+Math.random()*900000))}
function inviteUrl(code){
  const base=window.location.href.split("#")[0].split("?")[0];
  return base+"?room="+encodeURIComponent(code);
}
async function copyText(text,label){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta=document.createElement("textarea");
      ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    }
    $("copyStatus").textContent="✅ "+label+" copied!";
  }catch(e){
    $("copyStatus").textContent="Copy failed — long-press the text and copy it.";
  }
}
function showShare(){
  $("myCode").textContent=roomId;
  $("myCode").classList.remove("hidden");
  $("shareArea").classList.remove("hidden");
  $("inviteLink").value=inviteUrl(roomId);
}
function createMatch(){
 isHost=true; roomId=makeCode(); myStyle=$("styleSelect")?.value||"fast";
 peer=new Peer("ctcricket-"+roomId);
 peer.on("open",()=>{showShare();status("Give the code or invite link to your friend.");$("setupCard").classList.remove("hidden");});
 peer.on("connection",c=>{if(conn){c.close();return} conn=c;setupConnection();});
 peer.on("error",e=>status("Connection error: "+e.type));
}
function joinMatch(){
 roomId=$("roomInput").value.replace(/\D/g,"").slice(0,6);
 if(roomId.length!==6){status("Enter a 6-digit room code.");return}
 isHost=false;myStyle=$("styleSelect")?.value||"fast";
 peer=new Peer();
 peer.on("open",()=>{conn=peer.connect("ctcricket-"+roomId,{reliable:true});setupConnection();});
 peer.on("error",e=>status("Could not join: "+e.type));
}
function setupConnection(){
 conn.on("open",()=>{
  status("🟢 Connected!");$("setupCard").classList.remove("hidden");
  send({type:"hello",style:myStyle});
 });
 conn.on("data",handle);
 conn.on("close",()=>status("🔴 Opponent disconnected."));
}
let opponentStyle=null,opponentReady=false,myReady=false;
function handle(m){
 if(m.type==="hello"){opponentStyle=m.style; if(isHost)send({type:"hello",style:myStyle}); updateSetup();}
 if(m.type==="ready"){opponentReady=true;startIfReady();}
 if(m.type==="delivery")receiveDelivery(m.delivery);
 if(m.type==="result")receiveResult(m);
 if(m.type==="newinnings")receiveNewInnings(m);
}
function updateSetup(){
 $("setupInfo").textContent="Opponent bowling style: "+(opponentStyle==="fast"?"⚡ Fast":"🌀 Spin");
}
$("createBtn").onclick=createMatch;
$("joinBtn").onclick=joinMatch;
$("readyBtn").onclick=()=>{myReady=true;myStyle=$("styleSelect").value;send({type:"hello",style:myStyle});send({type:"ready"});$("readyBtn").disabled=true;$("setupInfo").textContent="Waiting for opponent…";startIfReady()};
function startIfReady(){
 if(!myReady||!opponentReady)return;
 state={score:0,wk:0,balls:0,phase:"bowling",delivery:null,batPlayer:isHost?2:1,bowlPlayer:isHost?1:2};
 $("connectCard").classList.add("hidden");$("setupCard").classList.add("hidden");$("game").classList.remove("hidden");
 render();showBowling();
}
function render(){
 $("score").textContent=state.score+"/"+state.wk;$("ballNo").textContent=state.balls;
 $("turn").textContent=state.phase==="bowling"?(isHost?"Player 1 bowls":"Player 2 bowls"):"Waiting for batting";
 $("deliveryText").textContent=state.delivery?("Delivery: "+state.delivery):"Choose a delivery";
}
function showBowling(){
 const myBowling=(isHost&&state.bowlPlayer===1)||(!isHost&&state.bowlPlayer===2);
 $("bowCard").classList.toggle("hidden",!myBowling);$("batCard").classList.toggle("hidden",myBowling);
 if(!myBowling){$("msg").textContent="Opponent is bowling…";return}
 const style=myStyle;let html="";
 for(const group in DB[style]){
  html+="<div><b>"+(style==="fast"?"⚡ ":"🌀 ")+group+"</b></div>";
  DB[style][group].forEach(d=>html+='<button data-delivery="'+d.replace(/"/g,"&quot;")+'">'+d+"</button>");
 }
 $("bowlButtons").innerHTML=html;
 $("bowlButtons").querySelectorAll("button").forEach(b=>b.onclick=()=>bowl(b.dataset.delivery));
}
function bowl(d){
 state.delivery=d;state.phase="batting";render();
 send({type:"delivery",delivery:d});
 animateBall();
 setTimeout(showShots,550);
}
function receiveDelivery(d){
 state.delivery=d;state.phase="batting";render();animateBall();setTimeout(showShots,550);
}
function showShots(){
 const amBatting=(isHost&&state.batPlayer===1)||(!isHost&&state.batPlayer===2);
 $("bowCard").classList.toggle("hidden",amBatting);$("batCard").classList.toggle("hidden",!amBatting);
 if(!amBatting){$("msg").textContent="🏏 Opponent is batting…";return}
 const valid=MAP[state.delivery]||[];
 $("msg").textContent=valid.length?"Choose a shot":"Choose defence or push";
 $("shotButtons").innerHTML="";
 SHOTS.forEach(s=>{
  const b=document.createElement("button");b.textContent=s.toUpperCase();
  b.disabled=!(s==="defence"||s==="push"||valid.includes(s));b.onclick=()=>playShot(s);$("shotButtons").appendChild(b);
 });
}
function animateBall(){
 $("ball").style.top="45px";$("ball").style.left="50%";
 setTimeout(()=>{$("ball").style.top="270px";$("ball").style.left=(44+Math.random()*12)+"%";},20);
}
function playShot(s){
 const valid=MAP[state.delivery]||[];let result,run=0;
 if(s==="defence")result=Math.random()<.9?"DOT":"WICKET";
 else if(s==="push"){let r=Math.random();if(r<.65){run=1;result="1 RUN"}else if(r<.85){run=2;result="2 RUNS"}else if(r<.95)result="DOT";else result="WICKET"}
 else if(valid.includes(s)){let r=Math.random();if(r<.18){run=6;result="SIX! 🔥"}else if(r<.48){run=4;result="FOUR!"}else if(r<.75){run=Math.random()<.5?1:2;result=run+" RUN"}else result="DOT"}
 else result="WICKET";
 send({type:"result",result,run,shot:s,delivery:state.delivery});
 applyResult(result,run);
}
function receiveResult(m){applyResult(m.result,m.run)}
function applyResult(result,run){
 state.score+=run||0; if(result==="WICKET")state.wk++;state.balls++;
 $("msg").textContent=result;render();
 if(state.wk>=3||state.balls>=12){setTimeout(endInnings,700);return}
 setTimeout(nextBall,700);
}
function nextBall(){state.delivery=null;state.phase="bowling";render();showBowling()}
function endInnings(){
 $("bowCard").classList.add("hidden");$("batCard").classList.add("hidden");
 $("msg").textContent="🏁 Innings complete: "+state.score+"/"+state.wk;
 if(isHost){setTimeout(()=>{send({type:"newinnings"});resetSecond();},1200)}
}
function receiveNewInnings(){resetSecond()}
function resetSecond(){
 state={score:0,wk:0,balls:0,phase:"bowling",delivery:null,batPlayer:state.bowlPlayer,bowlPlayer:state.batPlayer};
 $("msg").textContent="🔄 Second innings!";
 render();setTimeout(showBowling,900);
}
$("copyCodeBtn").onclick=()=>copyText(roomId,"Room code");
$("copyLinkBtn").onclick=()=>copyText(inviteUrl(roomId),"Invite link");
$("shareBtn").onclick=async()=>{
  const url=inviteUrl(roomId);
  if(navigator.share){
    try{await navigator.share({title:"CT Cricket Multiplayer",text:"Join my CT Cricket match! Room code: "+roomId,url});$("copyStatus").textContent="✅ Share sheet opened."}
    catch(e){}
  }else copyText(url,"Invite link");
};

function autoJoinFromUrl(){
  const params=new URLSearchParams(window.location.search);
  const code=(params.get("room")||"").replace(/\D/g,"").slice(0,6);
  if(code.length===6){
    $("roomInput").value=code;
    status("Invite link detected. Tap JOIN MATCH.");
  }
}
newMatchUI();
autoJoinFromUrl();
function newMatchUI(){$("styleSelect").value="fast"}
})();
</script>
</body>
</html>
